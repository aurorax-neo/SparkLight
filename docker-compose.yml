services:
  sparklight:
    build:
      context: .
      dockerfile: Dockerfile
    image: sparklight:latest
    container_name: sparklight
    restart: unless-stopped
    ports:
      - "0.0.0.0:11090:8080"
    volumes:
      - /opt/docker/sparklight/data:/data
    environment:
      - TZ=Asia/Shanghai
      - SPARK_HOST=0.0.0.0
      - SPARK_PORT=8080
      - SPARK_DATA_DIR=/data
      - SPARK_SCHEDULE_TIME=09:30
      - RUST_LOG=info
