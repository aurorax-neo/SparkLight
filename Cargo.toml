[package]
name = "sparklight"
version = "0.1.0"
edition = "2024"
default-run = "sparklight"
# 多抖音账号隔离与每日续火花系统
description = "多抖音账号隔离与每日续火花系统"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15.7"
futures = "0.3.34"
hex = "0.4"
md5 = "0.8.1"
rquickjs = { version = "=0.11.0", default-features = false, features = ["std"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "brotli", "deflate", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "pem", "std"] }
hkdf = "=0.12.4"
hmac = "=0.12.1"
aes = "=0.8.4"
rsa = "=0.9.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
tempfile = "3.17"
tokio = { version = "1.40", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["cors", "set-header", "timeout", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }

